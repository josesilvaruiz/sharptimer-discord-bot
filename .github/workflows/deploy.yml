name: Deploy Discord Bot
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Copy bot.py to server
        run: |
          scp -i ~/.ssh/id_ed25519 bot.py \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/sharptimer-bot/bot.py
      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'systemctl restart sharptimer-bot && systemctl is-active sharptimer-bot'
